{% extends "base.html" %}
{% block title %}Sign In - Murang'a County Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-navy text-white text-center p-4">
                    <i class="fa-solid fa-user-lock fs-1 text-warning mb-2"></i>
                    <h4 class="fw-bold mb-0">Citizen Sign In</h4>
                    <small class="text-white-50">Murang'a County Public Services Portal</small>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label class="form-label fw-bold fs-7">Identifier (Email, National ID, or Phone)</label>
                            <input type="text" name="email" class="form-control fs-7" placeholder="Enter email, ID, or phone number" required autocomplete="username">
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label fw-bold fs-7 mb-0">Password</label>
                                <a href="{{ url_for('auth.forgot_password') }}" class="fs-8 text-primary text-decoration-none">Forgot Password?</a>
                            </div>
                            <input type="password" name="password" class="form-control fs-7" placeholder="Enter account password" required autocomplete="current-password">
                        </div>

                        <button type="submit" class="btn btn-navy fw-bold w-100 py-2 rounded-3 fs-7 mb-3">
                            <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
                        </button>
                    </form>

                    <div class="text-center border-top pt-3 fs-7 text-muted">
                        Don't have an account yet? <a href="{{ url_for('auth.register') }}" class="fw-bold text-navy text-decoration-none">Register Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
