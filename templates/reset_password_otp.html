{% extends "base.html" %}
{% block title %}Complete Password Reset - Murang'a County Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-navy text-white text-center p-4">
                    <i class="fa-solid fa-lock-open fs-1 text-warning mb-2"></i>
                    <h4 class="fw-bold mb-0">Set New Password</h4>
                    <small class="text-white-50">Enter reset OTP code and new password</small>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.reset_password_otp') }}">
                        <div class="mb-3">
                            <label class="form-label fw-bold fs-7">6-Digit Reset OTP Code</label>
                            <input type="text" name="otp_code" class="form-control form-control-lg text-center letter-spacing-5 fw-bold fw-mono fs-4" placeholder="123456" maxlength="6" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold fs-7">New Password</label>
                            <input type="password" name="new_password" class="form-control fs-7" placeholder="Enter new strong password" required minlength="6">
                        </div>

                        <button type="submit" class="btn btn-navy fw-bold w-100 py-2 rounded-3 fs-7 mb-3">
                            <i class="fa-solid fa-shield-check me-1"></i> Complete Password Reset
                        </button>
                    </form>

                    <div class="text-center border-top pt-3 fs-7 text-muted">
                        <a href="{{ url_for('auth.login') }}" class="fw-bold text-navy text-decoration-none">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
