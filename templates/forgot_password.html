{% extends "base.html" %}
{% block title %}Reset Password - Murang'a County Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-navy text-white text-center p-4">
                    <i class="fa-solid fa-key fs-1 text-warning mb-2"></i>
                    <h4 class="fw-bold mb-0">Forgot Password</h4>
                    <small class="text-white-50">Enter account identifier to request reset OTP</small>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                        <div class="mb-4">
                            <label class="form-label fw-bold fs-7">Email, National ID, or Phone Number</label>
                            <input type="text" name="identifier" class="form-control fs-7" placeholder="Enter your registered identifier" required>
                        </div>

                        <button type="submit" class="btn btn-navy fw-bold w-100 py-2 rounded-3 fs-7 mb-3">
                            <i class="fa-solid fa-paper-plane me-1"></i> Send Password Reset OTP
                        </button>
                    </form>

                    <div class="text-center border-top pt-3 fs-7 text-muted">
                        Remembered your password? <a href="{{ url_for('auth.login') }}" class="fw-bold text-navy text-decoration-none">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
