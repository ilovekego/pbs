{% extends "base.html" %}
{% block title %}Create Citizen Account - Murang'a County Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-navy text-white text-center p-4">
                    <i class="fa-solid fa-user-plus fs-1 text-warning mb-2"></i>
                    <h4 class="fw-bold mb-0">Create Citizen Account</h4>
                    <small class="text-white-50">Murang'a County Public Services Portal</small>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold fs-7">Full Official Name</label>
                                <input type="text" name="full_name" class="form-control fs-7" placeholder="e.g. John Mwangi" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold fs-7">Email Address</label>
                                <input type="email" name="email" class="form-control fs-7" placeholder="e.g. john@example.com" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold fs-7">National ID / Passport Number</label>
                                <input type="text" name="national_id" class="form-control fs-7" placeholder="e.g. 28394012" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold fs-7">Mobile Phone Number</label>
                                <input type="tel" name="phone" class="form-control fs-7" placeholder="e.g. 0712345678" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold fs-7">Constituency</label>
                                <select name="constituency" class="form-select fs-7" required>
                                    <option value="" selected disabled>-- Select Constituency --</option>
                                    <option value="Kiharu">Kiharu</option>
                                    <option value="Kangema">Kangema</option>
                                    <option value="Mathioya">Mathioya</option>
                                    <option value="Maragua">Maragua</option>
                                    <option value="Kandara">Kandara</option>
                                    <option value="Gatanga">Gatanga</option>
                                    <option value="Kigumo">Kigumo</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold fs-7">Electoral Ward</label>
                                <input type="text" name="ward" class="form-control fs-7" placeholder="e.g. Township" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold fs-7">Account Password</label>
                            <input type="password" name="password" class="form-control fs-7" placeholder="Create a strong password" required minlength="6">
                        </div>

                        <button type="submit" class="btn btn-navy fw-bold w-100 py-2 rounded-3 fs-7 mb-3">
                            <i class="fa-solid fa-user-check me-1"></i> Complete Registration
                        </button>
                    </form>

                    <div class="text-center border-top pt-3 fs-7 text-muted">
                        Already have an account? <a href="{{ url_for('auth.login') }}" class="fw-bold text-navy text-decoration-none">Sign In Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
