{% extends "base.html" %}
{% block title %}Set New Password - Murang'a Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-navy text-white text-center py-4">
                    <i class="fa-solid fa-shield-halved fs-2 mb-2"></i>
                    <h4 class="fw-bold mb-0">Set New Password</h4>
                    <p class="text-white-50 fs-8 mb-0">Verify Reset Code & Update Password</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST" action="{{ url_for('auth.reset_password_otp') }}">
                        <div class="mb-3">
                            <label class="form-label fw-bold fs-7">6-Digit Reset OTP Code <span class="text-danger">*</span></label>
                            <input type="text" name="otp_code" class="form-control text-center fw-bold fs-5" maxlength="6" placeholder="000000" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold fs-7">New Password <span class="text-danger">*</span></label>
                            <input type="password" id="newPassword" name="new_password" class="form-control" placeholder="Enter new password" required>
                        </div>

                        <button type="submit" class="btn btn-success text-white w-100 py-2 rounded-3 fw-bold">
                            <i class="fa-solid fa-lock-open me-1"></i> Update Password & Login
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
